name: Deploy Backend Despacho to AWS ECR

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compilar proyecto con Maven (Generar JAR)
      run: mvn clean package -DskipTests

    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Construir y subir Imagen a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: back-despacho
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Login en Amazon ECR para obtener URL
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Desplegar Despacho en EC2 Privada via Puente SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_EC2_PRIVATE_IP_DESPACHO }}
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        proxy_host: ${{ secrets.AWS_EC2_IP }}
        proxy_username: ec2-user
        proxy_key: ${{ secrets.AWS_SSH_KEY }}
        envs: ECR_REGISTRY
        envs_format: tomal
        script: |
          export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          docker stop back-despacho || true
          docker rm back-despacho || true
          
          # Descargar y levantar en el puerto 8081
          docker pull $ECR_REGISTRY/back-despacho:latest
          docker run -d --name back-despacho -p 8081:8081 $ECR_REGISTRY/back-despacho:latest